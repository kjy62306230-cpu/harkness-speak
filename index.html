function renderAdmin(){
  if (S.adminTab === "roster") { loadRoster(); return; }
  if (S.adminTab === "students") { renderStudents(); return; }
  const d = S.adminData; if (!d) return;
  if (S.adminTab === "inactive") {
    const by = {};
    d.inactive.forEach(s => (by[s.class_label]=by[s.class_label]||[]).push(s));
    const keys = Object.keys(by);
    $("#apanel").innerHTML =
      '<div class="info" style="margin:0 0 10px">명단 '+d.roster_count+'명 중 <b>'+d.inactive.length+'명</b>이 최근 7일 안에 한 기록이 없어요.</div>'+
      (keys.length ? keys.map(c =>
        '<div class="card" style="padding:13px;margin-bottom:8px">'+
          '<b style="font-size:13.5px;color:var(--pri)">'+esc(c)+'</b>'+
          '<div class="pick" style="margin-top:9px">'+by[c].map(s =>
            '<span class="chip" style="font-size:13px">'+esc(s.name)+
            (s.school||s.grade ? '<small style="opacity:.55"> '+esc([s.school,s.grade].filter(Boolean).join(" "))+'</small>' : '')+
            (s.never ? '<small style="opacity:.6"> · 한 번도 안 함</small>'
                     : '<small style="opacity:.6"> · '+new Date(s.last_at).toLocaleDateString("ko-KR",{month:"numeric",day:"numeric"})+'</small>')+
            '</span>').join("")+'</div></div>').join("")
        : '<span class="muted">전원이 최근에 연습했어요 👏</span>');
  }
  else {
    const wrong = (d.rows||[]).filter(r => r.verdict !== "pass").slice(0, 40);
    $("#apanel").innerHTML = wrong.length ? wrong.map(r => {
      const f = r.feedback || {}, sen = r.tr_sentences || {}, pas = r.tr_passages || {};
      const errs = (f.errors||[]).map(e =>
        '<div style="margin-top:7px;padding:8px 10px;border-radius:9px;background:var(--bad-w);border:1px solid var(--bad-b)">'+
          '<b style="font-size:12px;color:var(--bad)">'+esc(e.part)+'</b>'+
          '<div class="tiny" style="margin-top:3px;color:var(--tx)">'+esc(e.why)+'</div></div>').join("");
      return '<div class="wrong">'+
        '<div class="hd"><span class="pill '+r.verdict+'" style="width:32px;height:32px;font-size:12px">'+r.score+'</span>'+
          '<b>'+esc(r.student_name||"이름없음")+'</b>'+
          '<span class="tiny">'+esc(pas.title||"")+' · '+new Date(r.created_at).toLocaleDateString("ko-KR",{month:"numeric",day:"numeric"})+'</span></div>'+
        (sen.en ? '<div class="en">'+esc(sen.en)+'</div>' : '')+
        '<div class="ln"><span class="k">학생</span><span>'+esc(r.transcript)+'</span></div>'+
        (sen.ko_ref ? '<div class="ln"><span class="k">모범</span><span style="color:var(--tx2)">'+esc(sen.ko_ref)+'</span></div>' : '')+
        errs+'</div>';
    }).join("") : '<span class="muted">틀린 기록이 없어요.</span>';
  }
}

/* ===== 학생별 약점 — 학생 → 지문 → 문장 순으로 파고든다 ===== */
function backBar(label, level){
  return '<button class="btn ghost sm" data-navback="'+level+'" style="text-align:left;margin-bottom:12px">‹ '+esc(label)+'</button>';
}

function renderStudents(){
  const d = S.adminData; if (!d) return;
  const N = S.nav;

  /* 1단계 — 코드로 들어와서 실제로 연습한 학생들 */
  if (N.level === "list") {
    $("#apanel").innerHTML = d.students.length ? d.students.map(s =>
      '<button class="card" style="padding:13px;margin-bottom:8px;width:100%;text-align:left;display:block" '+
        'data-stu="'+s.key+'" data-sname="'+esc(s.name)+'">'+
        '<div style="display:flex;align-items:center;gap:10px">'+
          '<b style="flex:1;font-size:14.5px">'+esc(s.name)+'</b>'+
          '<span class="tiny">'+new Date(s.last_at).toLocaleDateString("ko-KR",{month:"numeric",day:"numeric"})+'</span>'+
          '<span class="arw" style="font-size:13px;color:var(--tx3)">›</span></div>'+
        '<div class="tiny" style="margin-top:2px">'+esc([s.school,s.grade,s.class_label].filter(Boolean).join(" · "))+'</div>'+
        '<div class="tiny" style="margin-top:5px">지문 '+s.passage_count+'개 · 말한 문장 '+s.n+'개 · 평균 '+s.avg+'점 · 통과 '+s.rate+'%</div>'+
        '<div class="tiny" style="margin-top:2px">뜻 틀림 '+s.meaning_fail+'회 · 구조 틀림 '+s.structure_fail+'회</div>'+
        '<div style="margin-top:8px">'+weakHtml(s.kinds)+'</div></button>').join("")
      : '<span class="muted">아직 아무도 연습하지 않았어요.</span>';
    $$("[data-stu]").forEach(b => b.onclick = () => openStudent(b.dataset.stu, b.dataset.sname));
    return;
  }

  /* 2단계 — 그 학생이 푼 지문들 */
  if (N.level === "student") {
    const by = {};
    N.rows.forEach(r => { if (r.passage_id) (by[r.passage_id] = by[r.passage_id] ?? []).push(r); });
    const keys = Object.keys(by).sort((a,b) =>
      String(by[b][0].created_at).localeCompare(String(by[a][0].created_at)));

    $("#apanel").innerHTML = backBar("학생 목록", "list") +
      '<div class="card" style="padding:13px;margin-bottom:12px">'+
        '<b style="font-size:16px">'+esc(N.studentName)+'</b>'+
        '<div class="tiny" style="margin-top:4px">지문 '+keys.length+'개 · 총 '+N.rows.length+'번 말함</div>'+
      '</div>'+
      (keys.length ? keys.map(pid => {
        const arr = by[pid], p = arr[0].tr_passages || {};
        const uniq = new Set(arr.map(r => r.sentence_id)).size;
        const total = p.sentence_count || uniq;
        const avg = Math.round(arr.reduce((a,b)=>a+(b.score??0),0)/arr.length);
        const wrong = new Set(arr.filter(r=>r.verdict!=="pass").map(r=>r.sentence_id)).size;
        return '<button class="card" style="padding:13px;margin-bottom:8px;width:100%;text-align:left;display:block" data-pss="'+pid+'">'+
          '<div style="display:flex;align-items:center;gap:10px">'+
            '<b style="flex:1;font-size:14.5px">'+esc(p.title || "지문")+'</b>'+
            '<span class="tiny">'+new Date(arr[0].created_at).toLocaleDateString("ko-KR",{month:"numeric",day:"numeric"})+'</span>'+
            '<span style="font-size:13px;color:var(--tx3)">›</span></div>'+
          '<div class="tiny" style="margin-top:5px">'+
            '문장 '+total+'개 중 <b style="color:var(--pri)">'+uniq+'개</b> 풀이 · 말한 횟수 '+arr.length+'번 · 평균 '+avg+'점'+
            (wrong?' · <b style="color:var(--bad)">틀린 문장 '+wrong+'개</b>':' · 전부 통과')+'</div>'+
          '<div class="prog" style="margin-top:8px"><i style="width:'+Math.round(uniq/Math.max(total,1)*100)+'%"></i></div>'+
        '</button>';
      }).join("") : '<span class="muted">기록이 없어요.</span>');

    $$("[data-pss]").forEach(b => b.onclick = () => { S.nav.level="passage"; S.nav.passage=b.dataset.pss; renderStudents(); window.scrollTo(0,0); });
    bindNavBack();
    return;
  }

  /* 3단계 — 그 지문에서 문장마다 뭘 말했고 뭘 들었는지 전부 */
  const arr = N.rows.filter(r => r.passage_id === N.passage);
  const p = (arr[0] && arr[0].tr_passages) || {};
  const bySen = {};
  arr.forEach(r => (bySen[r.sentence_id] = bySen[r.sentence_id] ?? []).push(r));
  const senKeys = Object.keys(bySen).sort((a,b) =>
    ((bySen[a][0].tr_sentences||{}).idx ?? 0) - ((bySen[b][0].tr_sentences||{}).idx ?? 0));

  $("#apanel").innerHTML = backBar(N.studentName + " 의 지문 목록", "student") +
    '<div class="card" style="padding:13px;margin-bottom:12px">'+
      '<b style="font-size:16px">'+esc(p.title || "지문")+'</b>'+
      '<div class="tiny" style="margin-top:4px">'+esc(N.studentName)+' · 문장 '+senKeys.length+'개 · 말한 횟수 '+arr.length+'번</div>'+
    '</div>'+
    senKeys.map(sid => {
      const tries = bySen[sid].slice().sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at)));
      const sen = tries[0].tr_sentences || {};
      return '<div class="card" style="padding:13px;margin-bottom:10px">'+
        '<div class="tiny" style="font-weight:800;color:var(--tx3);margin-bottom:6px">문장 '+((sen.idx ?? 0)+1)+
          (tries.length>1 ? ' · '+tries.length+'번 시도' : '')+'</div>'+
        (tries.length>1 ? histHtml(tries.map((t,i)=>({n:t.try_no||i+1, score:t.score, verdict:t.verdict})))
          .replace('class="hist"','class="hist" style="margin:0 0 8px"') : '')+
        (sen.en ? '<div class="wrong"><div class="en" style="margin:0">'+esc(sen.en)+'</div>'+
          (sen.ko_ref ? '<div class="ln" style="margin-top:7px"><span class="k">모범</span><span style="color:var(--tx2)">'+esc(sen.ko_ref)+'</span></div>' : '')+
          (sen.ko_literal ? '<div class="ln"><span class="k">직역</span><span style="color:var(--tx3)">'+esc(sen.ko_literal)+'</span></div>' : '')+
          '</div>' : '')+
        tries.map((t,i) => attemptHtml(t, i+1, tries.length)).join("")+
      '</div>';
    }).join("");
  bindNavBack();
}

function attemptHtml(t, nth, total){
  const f = t.feedback || {};
  const errs = (f.errors||[]).map(e =>
    '<div class="eblk'+(e.kind==="vague"?" vague":"")+'" style="margin-top:8px">'+
      '<div class="part">'+esc(e.part)+'<em>'+esc(EKIND[e.kind]||e.kind)+'</em></div>'+
      '<div class="eline"><span class="k">말함</span><span class="x">'+esc(e.student_said)+'</span></div>'+
      '<div class="eline"><span class="k">정답</span><span class="o">'+esc(e.should_be)+'</span></div>'+
      '<div class="why">'+esc(e.why)+'</div></div>').join("");
  return '<div style="margin-top:10px;padding-top:11px;border-top:1px solid var(--line2)">'+
    '<div style="display:flex;align-items:center;gap:9px">'+
      '<span class="pill '+t.verdict+'" style="width:32px;height:32px;font-size:12px">'+t.score+'</span>'+
      '<span style="flex:1;min-width:0">'+
        '<span class="tags" style="display:flex;gap:5px;margin-bottom:2px">'+
          '<span class="tg '+(f.meaning_ok?"y":"n")+'">뜻 '+(f.meaning_ok?"○":"✕")+'</span>'+
          '<span class="tg '+(f.structure_ok?"y":"n")+'">구조 '+(f.structure_ok?"○":"✕")+'</span>'+
          '<span class="tiny">'+(t.mode==="en2ko"?"해석":"영작")+
            (total>1 ? ' · '+(t.try_no||nth)+'차' : '')+
            (t.input_mode==="typed" ? ' · ⌨ 타이핑' : '')+' · '+
            new Date(t.created_at).toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit"})+'</span>'+
        '</span>'+
        '<span style="font-size:13px;font-weight:700;display:block">'+esc(f.summary||"")+'</span>'+
      '</span></div>'+
    '<div class="said" style="margin-top:9px"><b>학생이 '+(t.input_mode==="typed"?"적은":"말한")+' 것</b>'+esc(t.transcript)+'</div>'+
    (f.meaning_note||f.structure_note ?
      '<div class="judge" style="margin-top:8px">'+
        '<div class="jrow '+(f.meaning_ok?"y":"n")+'"><span class="ic">'+(f.meaning_ok?"○":"✕")+'</span>'+
          '<span class="jt"><b>의미 전달</b>'+esc(f.meaning_note||"")+'</span></div>'+
        '<div class="jrow '+(f.structure_ok?"y":"n")+'"><span class="ic">'+(f.structure_ok?"○":"✕")+'</span>'+
          '<span class="jt"><b>구조 파악</b>'+esc(f.structure_note||"")+'</span></div>'+
      '</div>' : '')+
    errs+
    (f.good ? '<div class="gblk"><b>잘한 점 &nbsp;</b>'+esc(f.good)+'</div>' : '')+
    (f.tip ? '<div class="tip">'+esc(f.tip)+'</div>' : '')+
  '</div>';
}

async function openStudent(key, name){
  $("#apanel").innerHTML = '<div style="text-align:center;padding:22px"><span class="spin"></span></div>';
  try {
    const j = await fn("tr-history", { token:S.token, student_key:key, limit:1500 });
    S.nav = { level:"student", student:key, studentName:name, passage:null, rows:j.rows||[] };
    renderStudents(); window.scrollTo(0,0);
  } catch(e){ $("#apanel").innerHTML = '<div class="err">'+esc(e.message)+'</div>'; }
}

function bindNavBack(){
  $$("[data-navback]").forEach(b => b.onclick = () => {
    S.nav.level = b.dataset.navback;
    if (S.nav.level === "list") S.nav = { level:"list", rows:[] };
    renderStudents(); window.scrollTo(0,0);
  });
}

/* ===== 학생 관리 (추가 · 코드 발급) ===== */
async function loadRoster(){
  $("#apanel").innerHTML = '<span class="muted">불러오는 중…</span>';
  let list = [];
  try { const j = await fn("tr-auth", { action:"students", token:S.token }); list = j.students; }
  catch(e){ $("#apanel").innerHTML = '<div class="err">'+esc(e.message)+'</div>'; return; }

  const form =
    '<div class="card" style="padding:14px;margin-bottom:12px">'+
      '<b style="display:block;font-size:14px;margin-bottom:10px">학생 추가</b>'+
      '<input class="field" id="nsName" placeholder="이름" style="margin-bottom:7px">'+
      '<div style="display:flex;gap:7px;margin-bottom:7px">'+
        '<input class="field" id="nsSchool" placeholder="학교 (예: 부산고)" style="flex:1;min-width:0">'+
        '<input class="field" id="nsGrade" placeholder="학년 (예: 고2)" style="width:38%;min-width:0">'+
      '</div>'+
      '<input class="field" id="nsClass" placeholder="반 (예: 화목 7시) — 비워도 됩니다" style="margin-bottom:9px">'+
      '<button class="btn sm" id="nsAdd">추가하고 코드 만들기</button>'+
      '<p class="label" style="margin:14px 0 7px"><span>여러 명 한 번에</span></p>'+
      '<textarea class="field" id="nsBulk" placeholder="한 줄에 한 명씩. 쉼표로 학교·학년까지 적을 수 있어요&#10;김민준, 부산고, 고2&#10;이서연, 해운대여고, 고1&#10;박지호" style="min-height:96px;margin-bottom:7px"></textarea>'+
      '<button class="btn sm ghost" id="nsBulkAdd">위 이름 전부 추가</button>'+
      '<div id="nsErr"></div>'+
    '</div>';

  const rows = list.length ? list.map(s =>
    '<div class="card" style="padding:12px;margin-bottom:8px;opacity:'+(s.active?1:.5)+'">'+
      '<div style="display:flex;align-items:center;gap:10px">'+
        '<div style="flex:1;min-width:0">'+
          '<b style="font-size:14.5px">'+esc(s.name)+'</b>'+
          (s.active?'':'<span class="tiny" style="color:var(--bad)"> · 사용 중지</span>')+
          '<div class="tiny">'+esc([s.school, s.grade, s.class_label].filter(Boolean).join(" · ") || "정보 없음")+'</div>'+
          '<div class="tiny">'+(s.last_login_at
              ? '마지막 접속 '+new Date(s.last_login_at).toLocaleDateString("ko-KR",{month:"numeric",day:"numeric"})
              : '아직 접속 안 함')+'</div>'+
        '</div>'+
        '<div style="font-family:ui-monospace,Menlo,monospace;font-size:19px;font-weight:800;letter-spacing:2px;'+
          'color:var(--pri);background:var(--pri-w);padding:8px 12px;border-radius:10px">'+esc(s.code)+'</div>'+
      '</div>'+
      '<div class="again" style="margin-top:9px">'+
        '<button data-sedit="'+s.id+'" data-j=\''+esc(JSON.stringify({name:s.name,school:s.school||"",grade:s.grade||"",class_label:s.class_label||""}))+'\'>정보 수정</button>'+
        '<button data-newcode="'+s.id+'" data-n="'+esc(s.name)+'">코드 재발급</button>'+
        '<button data-toggle="'+s.id+'" data-a="'+(s.active?0:1)+'">'+(s.active?"사용 중지":"다시 사용")+'</button>'+
        '<button data-del="'+s.id+'" data-n="'+esc(s.name)+'" style="color:var(--bad)">삭제</button>'+
      '</div></div>').join("")
    : '<span class="muted">아직 등록한 학생이 없어요. 위에서 추가하세요.</span>';

  $("#apanel").innerHTML = form +
    '<p class="label"><span>등록된 학생 '+list.length+'명</span></p>' + rows;

  $("#nsAdd").onclick = async () => {
    const name = $("#nsName").value.trim();
    if (!name) { showErr("#nsErr","이름을 입력해 주세요."); return; }
    const b = $("#nsAdd"); b.disabled = true;
    try {
      const j = await fn("tr-auth", { action:"student_add", token:S.token, name,
        school:$("#nsSchool").value, grade:$("#nsGrade").value, class_label:$("#nsClass").value });
      $("#nsName").value = "";
      alert(j.student.name + " 학생 코드: " + j.student.code + "\n이 코드를 알려주세요.");
      loadRoster();
    } catch(e){ showErr("#nsErr", esc(e.message)); b.disabled = false; }
  };
  $("#nsBulkAdd").onclick = async () => {
    const names = $("#nsBulk").value.trim();
    if (!names) { showErr("#nsErr","이름을 한 줄에 한 명씩 적어주세요."); return; }
    const b = $("#nsBulkAdd"); b.disabled = true; b.innerHTML = '<span class="spin"></span> 만드는 중…';
    try {
      const j = await fn("tr-auth", { action:"student_bulk", token:S.token, names,
        school:$("#nsSchool").value, grade:$("#nsGrade").value, class_label:$("#nsClass").value });
      $("#nsBulk").value = "";
      alert(j.students.length + "명 추가했어요." + (j.failed.length ? "\n실패: "+j.failed.join(", ") : ""));
      loadRoster();
    } catch(e){ showErr("#nsErr", esc(e.message)); b.disabled=false; b.textContent="위 이름 전부 추가"; }
  };
  $$("[data-sedit]").forEach(b => b.onclick = async () => {
    let cur = {}; try { cur = JSON.parse(b.dataset.j); } catch(e){}
    const name = prompt("이름", cur.name || ""); if (name === null) return;
    const school = prompt("학교", cur.school || ""); if (school === null) return;
    const grade = prompt("학년", cur.grade || ""); if (grade === null) return;
    const cls = prompt("반", cur.class_label || ""); if (cls === null) return;
    try { await fn("tr-auth", { action:"student_update", token:S.token, id:b.dataset.sedit,
      name, school, grade, class_label:cls }); loadRoster(); }
    catch(e){ alert(e.message); }
  });
  $$("[data-newcode]").forEach(b => b.onclick = async () => {
    if (!confirm(b.dataset.n + " 학생의 코드를 새로 만들까요?\n예전 코드로는 못 들어오게 됩니다.")) return;
    try { const j = await fn("tr-auth", { action:"student_update", token:S.token, id:b.dataset.newcode, new_code:true });
      alert("새 코드: " + j.student.code); loadRoster();
    } catch(e){ alert(e.message); }
  });
  $$("[data-toggle]").forEach(b => b.onclick = async () => {
    try { await fn("tr-auth", { action:"student_update", token:S.token, id:b.dataset.toggle, active:b.dataset.a==="1" }); loadRoster(); }
    catch(e){ alert(e.message); }
  });
  $$("[data-del]").forEach(b => b.onclick = async () => {
    if (!confirm(b.dataset.n + " 학생을 목록에서 지울까요?\n그 학생의 연습 기록도 함께 사라집니다.")) return;
    try { await fn("tr-auth", { action:"student_delete", token:S.token, id:b.dataset.del }); loadRoster(); }
    catch(e){ alert(e.message); }
  });
}

/* ================= 시작 ================= */
(function init(){
  const m = load("mode"); if(m){ S.mode=m; $$(".seg button").forEach(b=>b.classList.toggle("on", b.dataset.mode===m)); }
  const t = load("token");
  if (t) {
    S.token = t;
    fn("tr-auth", { action:"me", token:t }).then(j => {
      S.admin = j.kind === "admin";
      S.me = { id: j.tr_student_id ?? null, name: j.name };
      $("#who").textContent = j.name;
      enterApp();
    }).catch(() => { S.token=null; save("token",null); go("login"); });
  } else go("login");
  /* 예전에 만든 홈 화면 아이콘은 여전히 앱 모드로 열린다 — 그때는 마이크가 막힌다 */
  if (window.navigator.standalone === true) {
    const w = document.createElement("div");
    w.className = "err";
    w.style.cssText = "margin:10px 14px;line-height:1.6";
    w.innerHTML = "<b>홈 화면 아이콘으로 열면 마이크가 안 돼요.</b><br>"+
      "아이폰 제약이에요. <b>사파리에서 직접 주소로 접속</b>해 주세요.<br>"+
      "<span style='opacity:.85'>홈 화면 아이콘을 지우고 다시 추가하면 사파리로 열립니다.</span>";
    document.body.prepend(w);
  }
  document.addEventListener("visibilitychange", () => { if(document.hidden) abortRec("녹음이 중단됐어요. 다시 눌러주세요."); });
  // 빈 곳을 누르면 열려 있던 ⋯ 메뉴는 닫는다
  document.addEventListener("click", () => { $$("[data-menu]").forEach(x => x.classList.add("hide")); });
})();
</script>
</body>
</html>
