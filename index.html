<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#4f46e5">
<!-- apple-mobile-web-app-capable 은 넣지 않는다.
     넣으면 홈 화면 아이콘이 앱 모드로 열리는데, iOS 는 그 모드에서 마이크를 차단한다. -->
<title>하크니스 해석 트레이너</title>
<style>
:root{
  --bg:#f6f7fb; --card:#ffffff; --line:#e4e6ef; --line2:#eef0f6;
  --tx:#1a1c26; --tx2:#5b6070; --tx3:#8b90a3;
  --pri:#4f46e5; --pri-w:#eef0ff;
  --ok:#15803d; --ok-w:#e8f7ee; --ok-b:#bfe7cd;
  --mid:#b45309; --mid-w:#fef4e4; --mid-b:#f4dcae;
  --bad:#be123c; --bad-w:#fdedf1; --bad-b:#f6cdd8;
  --rec:#e11d48;
  --sh:0 1px 2px rgba(20,22,40,.05), 0 4px 14px rgba(20,22,40,.06);
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1116; --card:#171a21; --line:#272b36; --line2:#20242d;
    --tx:#e9ebf2; --tx2:#a2a8bb; --tx3:#757b8e;
    --pri:#8b85ff; --pri-w:#1e1f3a;
    --ok:#6ee7a5; --ok-w:#12251b; --ok-b:#1f4432;
    --mid:#f5c26b; --mid-w:#2a2113; --mid-b:#4d3c1c;
    --bad:#fb7e9c; --bad-w:#2b1520; --bad-b:#512434;
    --rec:#fb7185;
    --sh:0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  font-size:15px;line-height:1.62;-webkit-text-size-adjust:100%}
.wrap{max-width:580px;margin:0 auto;padding:0 14px calc(90px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.hide{display:none !important}

.top{position:sticky;top:0;z-index:40;background:var(--bg);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
.top-in{max-width:580px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:9px;min-height:52px}
.top h1{font-size:15px;font-weight:700;margin:0;flex:1;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--tx2);font-size:18px}
.iconbtn:active{background:var(--line2)}
.who{font-size:12px;font-weight:700;color:var(--pri);background:var(--pri-w);padding:5px 11px;border-radius:999px;
  flex:none;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sec{margin-top:16px}
.label{font-size:12px;font-weight:700;color:var(--tx3);letter-spacing:.3px;margin:0 0 8px 2px;
  display:flex;align-items:center;justify-content:space-between}
.label a{color:var(--pri);font-size:12px;font-weight:700;text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.btn{display:block;width:100%;padding:14px;border-radius:13px;background:var(--pri);color:#fff;
  font-weight:700;font-size:15px;text-align:center;letter-spacing:-.2px}
.btn:disabled{opacity:.45}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.btn.sm{padding:11px;font-size:14px;border-radius:11px}
.field{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);outline:none}
.field:focus{border-color:var(--pri)}
textarea.field{min-height:150px;resize:vertical;line-height:1.7;font-size:14px}
.muted{color:var(--tx2);font-size:13px}
.tiny{font-size:12px;color:var(--tx3)}
.spin{display:inline-block;width:15px;height:15px;border:2px solid currentColor;border-right-color:transparent;
  border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:var(--bad-w);border:1px solid var(--bad-b);color:var(--bad);padding:11px 13px;border-radius:12px;
  font-size:13px;line-height:1.55;margin-top:12px}
.info{background:var(--pri-w);border:1px solid var(--pri);color:var(--pri);padding:11px 13px;border-radius:12px;
  font-size:13px;line-height:1.55;margin-top:12px}

/* 로그인 */
.hero{text-align:center;padding:34px 6px 22px}
.hero .logo{width:54px;height:54px;border-radius:17px;background:var(--pri);color:#fff;display:grid;place-items:center;
  margin:0 auto 14px;font-size:25px;box-shadow:var(--sh)}
.hero h2{margin:0 0 6px;font-size:21px;letter-spacing:-.4px}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.names{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.names .chip{text-align:center;padding:11px 4px;border-radius:12px;white-space:normal;line-height:1.3}
.names .chip small{display:block;font-size:10.5px;font-weight:600;opacity:.62}
.pinbox{text-align:center;padding:10px 0}
.pinbox input{width:170px;text-align:center;font-size:26px;letter-spacing:12px;font-weight:700;
  padding:14px 0 14px 12px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--tx);outline:none}
.pinbox input:focus{border-color:var(--pri)}
.foot{text-align:center;margin-top:26px}
.foot a{font-size:12.5px;color:var(--tx3);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:1px}

/* 드롭존 */
.drop{margin-top:18px;border:2px dashed var(--line);border-radius:20px;background:var(--card);
  padding:30px 18px;text-align:center;transition:border-color .15s,background .15s}
.drop.on{border-color:var(--pri);background:var(--pri-w)}
.drop .ico{font-size:32px;line-height:1;margin-bottom:9px}
.drop b{display:block;font-size:16px;letter-spacing:-.3px;margin-bottom:4px}
.drop span{font-size:13px;color:var(--tx3);line-height:1.5}
.drop .go{margin-top:13px;display:inline-block;background:var(--pri);color:#fff;padding:10px 20px;border-radius:11px;font-size:14px;font-weight:700}

.plist{display:flex;flex-direction:column;gap:9px}
.pitem{display:flex;align-items:center;gap:12px;padding:14px;text-align:left;width:100%;
  background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh)}
.pitem:active{border-color:var(--pri)}
.pitem .t{flex:1;min-width:0}
.pitem .t b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .t span{font-size:12px;color:var(--tx3)}
.pitem .n{font-size:11px;font-weight:700;color:var(--pri);background:var(--pri-w);padding:5px 9px;border-radius:8px;flex:none}

/* ⋯ 메뉴 */
.dots{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;
  color:var(--tx3);font-size:17px;letter-spacing:1px;line-height:1}
.dots:active{background:var(--line2)}
.menu{position:absolute;right:10px;top:calc(100% - 8px);z-index:60;min-width:158px;
  background:var(--card);border:1px solid var(--line);border-radius:13px;padding:5px;
  box-shadow:0 10px 28px rgba(10,12,20,.22), 0 2px 6px rgba(10,12,20,.12)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .menu{box-shadow:0 10px 28px rgba(0,0,0,.55)} }
.menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:10px 11px;
  border-radius:9px;font-size:13.5px;font-weight:600}
.menu button:active{background:var(--line2)}
.menu button .mi{width:16px;text-align:center;font-size:13px;flex:none}
.menu button.danger{color:var(--bad)}

/* 학습 상단 */
.modebar{position:sticky;top:calc(55px + env(safe-area-inset-top));z-index:30;background:var(--bg);padding:10px 0 9px;border-bottom:1px solid var(--line2)}
.qsel{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.qsel select{flex:1;min-width:0;padding:11px 12px;font-size:14.5px;font-weight:700;border-radius:12px;
  border:1px solid var(--pri);background:var(--pri-w);color:var(--pri);outline:none;
  -webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  padding-right:34px}
.seg{display:flex;background:var(--line2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:13px;font-weight:700;color:var(--tx2)}
.seg button.on{background:var(--card);color:var(--pri);box-shadow:var(--sh)}
.subbar{display:flex;align-items:center;gap:9px;margin-top:9px}
.prog{flex:1;height:6px;border-radius:99px;background:var(--line2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .3s}
.progtx{font-size:11.5px;font-weight:700;color:var(--tx3);flex:none}

.slist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.sent{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;transition:border-color .2s}
.sent.act{border-color:var(--pri)}
.sent.pass{border-left:4px solid var(--ok)}
.sent.partial{border-left:4px solid var(--mid)}
.sent.fail{border-left:4px solid var(--bad)}
.srow{display:flex;gap:11px;padding:14px}
.snum{width:23px;height:23px;border-radius:7px;background:var(--line2);color:var(--tx2);font-size:11.5px;
  font-weight:800;display:grid;place-items:center;flex:none;margin-top:2px}
.sent.pass .snum{background:var(--ok-w);color:var(--ok)}
.sent.partial .snum{background:var(--mid-w);color:var(--mid)}
.sent.fail .snum{background:var(--bad-w);color:var(--bad)}
.stx{flex:1;min-width:0;font-size:15.5px;line-height:1.7;letter-spacing:-.1px;word-break:break-word}
.stx.en{font-family:"Georgia","Times New Roman",serif;font-size:16px;line-height:1.72}
.mic{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--pri-w);color:var(--pri);font-size:19px;align-self:flex-start;transition:transform .12s}
.mic:active{transform:scale(.92)}
.mic.rec{background:var(--rec);color:#fff;animation:pulse 1.15s ease-in-out infinite}
.mic.busy{background:var(--line2);color:var(--tx3)}
.keyb{width:46px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:var(--line2);color:var(--tx3);font-size:14px;align-self:flex-start;margin-top:6px}
.keyb:active{background:var(--line)}
.keyb.cancel{background:var(--bad-w);color:var(--bad);font-weight:800;font-size:15px;
  border:1px solid var(--bad)}
.inputcol{display:flex;flex-direction:column;align-items:center;flex:none;align-self:flex-start}
.typebox{margin:0 14px 14px}
.typebox textarea{width:100%;min-height:74px;padding:11px 12px;border-radius:12px;border:1px solid var(--pri);
  background:var(--card);color:var(--tx);font-size:14.5px;line-height:1.6;outline:none;resize:vertical}
.typebox .row{display:flex;gap:8px;margin-top:8px}
.typebox .row button{flex:1;padding:10px;border-radius:11px;font-size:13.5px;font-weight:700}
.typebox .row .go{background:var(--pri);color:#fff}
.typebox .row .no{border:1px solid var(--line);color:var(--tx2)}
.fillnote{margin:-4px 14px 10px;padding:7px 10px;border-radius:9px;background:var(--mid-w);border:1px solid var(--mid-b);color:var(--mid);font-size:11.5px;font-weight:700;line-height:1.5}
.more{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--pri);white-space:nowrap}
.hist{display:flex;gap:5px;flex-wrap:wrap;margin:0 14px 10px;align-items:center;cursor:pointer}
.hist .lbl{font-size:11px;font-weight:700;color:var(--tx3);margin-left:2px}
.htry{margin:0 14px 12px;padding:10px 12px;border-radius:11px;background:var(--card2,var(--line2));border:1px solid var(--line)}
.htry .row{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line2)}
.htry .row:first-child{border-top:none}
.htry .n{font-size:11px;font-weight:800;color:var(--tx3);flex:none;width:34px}
.htry .dt{font-size:10.5px;color:var(--tx3);flex:none;width:78px;font-weight:600}
.htry .row{align-items:flex-start}
.htry .tx{padding-top:1px}
.htry .sc{font-size:12px;font-weight:800;flex:none;width:34px}
.htry .tx{flex:1;min-width:0;font-size:12.5px;line-height:1.55;color:var(--tx2);word-break:break-word}
.htry .ag{margin-top:9px;width:100%;padding:9px;border-radius:9px;border:1px solid var(--pri);color:var(--pri);font-size:12.5px;font-weight:800;background:none}
.hb{font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px;background:var(--line2);color:var(--tx3)}
.hb.pass{background:var(--ok-w);color:var(--ok)}
.hb.partial{background:var(--mid-w);color:var(--mid)}
.hb.fail{background:var(--bad-w);color:var(--bad)}
.hb .ar{opacity:.5;margin:0 2px}
.deduct{margin:10px 0 0;padding:10px 12px;border-radius:11px;background:var(--mid-w);
  border:1px solid var(--mid-b);color:var(--mid);font-size:12.5px;line-height:1.6;font-weight:700}
.deduct b{display:block;font-size:11px;opacity:.8;margin-bottom:3px;letter-spacing:.3px}
.tbar{display:flex;gap:8px;margin:14px 0 4px}
.tbar button{flex:1;padding:12px;border-radius:12px;font-size:13.5px;font-weight:800}
.tbar .a{background:var(--pri);color:#fff}
.tbar .b{border:1px solid var(--pri);color:var(--pri)}
.grp{font-size:12px;font-weight:800;color:var(--tx3);margin:16px 2px 8px;letter-spacing:.3px}
.asg{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:1px}
.asg.all{background:var(--ok-w);color:var(--ok)}
.asg.some{background:var(--pri-w);color:var(--pri)}
.asg.none{background:var(--line2);color:var(--tx3)}
.asg.gift{background:var(--mid-w);color:var(--mid)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--bg);width:100%;max-width:520px;max-height:82vh;border-radius:18px 18px 0 0;
  display:flex;flex-direction:column;overflow:hidden}
.modal .hd{padding:16px 16px 10px;border-bottom:1px solid var(--line2)}
.modal .hd b{font-size:15px;display:block}
.modal .hd span{font-size:12px;color:var(--tx3)}
.modal .bd{overflow:auto;padding:6px 10px}
.modal label{display:flex;align-items:center;gap:10px;padding:11px 8px;border-radius:10px;font-size:14px}
.modal label:active{background:var(--line2)}
.modal label small{color:var(--tx3);font-size:11.5px;margin-left:auto}
.modal input[type=checkbox]{width:19px;height:19px;accent-color:var(--pri)}
.modal .ft{display:flex;gap:8px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line2)}
.modal .ft button{flex:1;padding:12px;border-radius:12px;font-weight:800;font-size:14px}
.modal .ft .go{background:var(--pri);color:#fff}
.modal .ft .no{border:1px solid var(--line);color:var(--tx2)}
.retryhint{margin:0 14px 12px;padding:10px 12px;border-radius:11px;background:var(--mid-w);
  border:1px solid var(--mid-b);color:var(--mid);font-size:12.5px;line-height:1.55;font-weight:600}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(225,29,72,.42)}50%{box-shadow:0 0 0 11px rgba(225,29,72,0)}}

.live{margin:0 14px 14px;padding:12px 13px;border-radius:12px;background:var(--pri-w);white-space:pre-line;
  border:1px dashed var(--pri);font-size:14.5px;line-height:1.65;min-height:46px}
.live.empty{color:var(--tx3);font-style:italic}
.live.ready{background:var(--mid-w);border:1px dashed var(--mid);color:var(--mid);
  font-style:normal;font-weight:800;text-align:center;font-size:15px}
.live.go{background:var(--ok-w);border:1px dashed var(--ok);color:var(--ok);
  font-style:normal;font-weight:800;text-align:center;font-size:15px}

.bar{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 14px;
  border-top:1px solid var(--line2);background:var(--card)}
.bar:active{background:var(--line2)}
.pill{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:14px;font-weight:800;letter-spacing:-.4px}
.pill.pass{background:var(--ok-w);color:var(--ok);border:1.5px solid var(--ok-b)}
.pill.partial{background:var(--mid-w);color:var(--mid);border:1.5px solid var(--mid-b)}
.pill.fail{background:var(--bad-w);color:var(--bad);border:1.5px solid var(--bad-b)}
.bar .mid{flex:1;min-width:0}
.bar .tags{display:flex;gap:5px;margin-bottom:3px}
.tg{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;letter-spacing:-.1px}
.tg.y{background:var(--ok-w);color:var(--ok)}
.tg.n{background:var(--bad-w);color:var(--bad)}
.bar .sm{font-size:13px;font-weight:700;line-height:1.45;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .arw{font-size:12px;color:var(--tx3);flex:none;transition:transform .2s}
.bar.open .arw{transform:rotate(180deg)}

.res{padding:0 14px 14px;border-top:1px solid var(--line2)}
.said{margin-top:12px;padding:10px 12px;border-radius:11px;background:var(--line2);font-size:13.5px;line-height:1.6;color:var(--tx2)}
.said b{display:block;font-size:11px;color:var(--tx3);font-weight:800;letter-spacing:.3px;margin-bottom:3px}
.judge{margin-top:10px;display:flex;flex-direction:column;gap:7px}
.jrow{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border-radius:11px;border:1px solid var(--line)}
.jrow.y{background:var(--ok-w);border-color:var(--ok-b)}
.jrow.n{background:var(--bad-w);border-color:var(--bad-b)}
.jrow .ic{font-size:13px;font-weight:900;flex:none;width:17px;text-align:center}
.jrow.y .ic{color:var(--ok)} .jrow.n .ic{color:var(--bad)}
.jrow .jt{flex:1;min-width:0;font-size:13px;line-height:1.55}
.jrow .jt b{display:block;font-size:11px;font-weight:800;letter-spacing:.2px;margin-bottom:1px}
.jrow.y .jt b{color:var(--ok)} .jrow.n .jt b{color:var(--bad)}

.eblk{margin-top:9px;border:1px solid var(--bad-b);background:var(--bad-w);border-radius:12px;padding:11px 12px}
.eblk.vague{border-color:var(--mid-b);background:var(--mid-w)}
.eblk .part{font-size:12.5px;font-weight:800;color:var(--bad);letter-spacing:-.1px}
.eblk.vague .part{color:var(--mid)}
.eblk .part em{font-style:normal;font-size:10.5px;background:rgba(0,0,0,.08);padding:1px 6px;border-radius:5px;margin-left:6px}
.eline{display:flex;gap:7px;margin-top:7px;font-size:13.5px;line-height:1.55;align-items:baseline}
.eline .k{font-size:11px;font-weight:800;color:var(--tx3);flex:none;width:26px;padding-top:1px}
.eline .x{text-decoration:line-through;color:var(--tx3)}
.eline .o{font-weight:700}
.why{margin-top:8px;padding-top:8px;border-top:1px dashed var(--bad-b);font-size:13px;line-height:1.62}
.eblk.vague .why{border-top-color:var(--mid-b)}
.gblk{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--ok-w);border:1px solid var(--ok-b);font-size:13px;line-height:1.6}
.gblk b{color:var(--ok);font-weight:800}
.ans{margin-top:9px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.ans b{display:block;font-size:11px;color:var(--tx3);font-weight:800;letter-spacing:.3px;margin-bottom:4px}

/* ================= 로그인 ================= */
function resetLogin(){ $("#codeInput").value = ""; }

/* 한글 자판 상태로 쳐도 코드가 들어가도록 (학생들이 한영 전환을 잊는다) */
const KMAP = {"ㅂ":"Q","ㅈ":"W","ㄷ":"E","ㄱ":"R","ㅅ":"T","ㅛ":"Y","ㅕ":"U","ㅑ":"I","ㅐ":"O","ㅔ":"P",
  "ㅁ":"A","ㄴ":"S","ㅇ":"D","ㄹ":"F","ㅎ":"G","ㅗ":"H","ㅓ":"J","ㅏ":"K","ㅣ":"L",
  "ㅋ":"Z","ㅌ":"X","ㅊ":"C","ㅍ":"V","ㅠ":"B","ㅜ":"N","ㅡ":"M",
  "ㅃ":"Q","ㅉ":"W","ㄸ":"E","ㄲ":"R","ㅆ":"T","ㅒ":"O","ㅖ":"P"};
const CHO = "ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ".split("");
const JUNG = "ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ".split("");
const JONG = ["","ㄱ","ㄲ","ㄳ","ㄴ","ㄵ","ㄶ","ㄷ","ㄹ","ㄺ","ㄻ","ㄼ","ㄽ","ㄾ","ㄿ","ㅀ","ㅁ","ㅂ","ㅄ","ㅅ","ㅆ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const JSPLIT = {"ㅘ":"ㅗㅏ","ㅙ":"ㅗㅐ","ㅚ":"ㅗㅣ","ㅝ":"ㅜㅓ","ㅞ":"ㅜㅔ","ㅟ":"ㅜㅣ","ㅢ":"ㅡㅣ",
  "ㄳ":"ㄱㅅ","ㄵ":"ㄴㅈ","ㄶ":"ㄴㅎ","ㄺ":"ㄹㄱ","ㄻ":"ㄹㅁ","ㄼ":"ㄹㅂ","ㄽ":"ㄹㅅ","ㄾ":"ㄹㅌ","ㄿ":"ㄹㅍ","ㅀ":"ㄹㅎ","ㅄ":"ㅂㅅ"};

function ko2en(str){
  let out = "";
  for (const ch of String(str)) {
    const c = ch.charCodeAt(0);
    if (c >= 0xAC00 && c <= 0xD7A3) {           // 조합된 한글 음절 → 자모로 풀어서 자판 글자로
      const i = c - 0xAC00;
      const jamo = CHO[Math.floor(i/588)] + JUNG[Math.floor((i%588)/28)] + JONG[i%28];
      for (const j of jamo) {
        if (!j) continue;
        for (const k of (JSPLIT[j] || j)) out += KMAP[k] || "";
      }
    } else out += (KMAP[ch] !== undefined) ? KMAP[ch] : ch;
  }
  return out;
}

const codeInp = $("#codeInput");
function cleanCode(){
  const v = ko2en(codeInp.value).toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 7);
  if (codeInp.value !== v) codeInp.value = v;
}
let composing = false;
codeInp.addEventListener("compositionstart", () => { composing = true; });
codeInp.addEventListener("compositionend", () => { composing = false; cleanCode(); });
codeInp.addEventListener("input", () => { if (!composing) cleanCode(); });

codeInp.addEventListener("keydown", e => {
  if (e.key === "Enter") { $("#codeOk").click(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;      // 붙여넣기·전체선택은 그대로
  // PC 에서는 눌린 물리 키를 직접 읽어 넣는다 — 한글 자판이 켜져 있어도 정확하다
  const m = /^(?:Key([A-Z])|Digit([0-9]))$/.exec(e.code || "");
  if (m) {
    e.preventDefault();
    const ch = m[1] || m[2];
    if (codeInp.value.length < 7) codeInp.value += ch;
  } else if (e.key === "Backspace") {
    e.preventDefault();
    codeInp.value = codeInp.value.slice(0, -1);
  }
});

}

async function openAssign(examId){
  const wrap = document.createElement("div");
  wrap.className = "modal";
  wrap.innerHTML = '<div class="box"><div class="hd"><b>불러오는 중…</b></div></div>';
  document.body.appendChild(wrap);
  const close = () => wrap.remove();
  wrap.onclick = e => { if (e.target === wrap) close(); };
  let j;
  try { j = await fn("tr-list", { token:S.token, action:"assign_get", exam_id:examId }); }
  catch(e){ wrap.querySelector(".hd").innerHTML = '<b>'+esc(e.message)+'</b>'; setTimeout(close,1600); return; }

  const on = new Set(j.exam.assigned_to || []);
  const all = !!j.exam.assigned_all;
  const byClass = {};

  // 시험지마다 몇 번부터 몇 번까지 들어 있는지 미리 계산해서 보여준다

/* 선생님이거나 본인이 올린 자료면 이름 바꾸기·삭제를 할 수 있다 */
function canEditExam(x){
  if (S.admin) return true;
  if (!x || !S.me) return false;
  if (!x.owner_id) return true;              // 주인 기록이 없는 예전 자료는 정리할 수 있게
  return x.owner_id === S.me.id;
}

/* 자료 안의 지문·모범해석·직역을 텍스트 파일로 내려받는다 (원본 PDF 는 저장하지 않으므로) */
async function downloadExam(examId, title){
  try {
    const ps = (await fn("tr-list", { token:S.token, action:"items", exam_id:examId, with_sentences:true })).items;
    let out = title + "\n" + "=".repeat(Math.max(title.length, 20)) + "\n" +
      "하크니스 해석 트레이너 · " + new Date().toLocaleDateString("ko-KR") + "\n\n";
    ps.forEach(p => {
      out += "\n[" + (p.title || "") + "]\n";
      const sens = (p.tr_sentences || []).slice().sort((a,b) => a.idx - b.idx);
      if (sens.length) {
        sens.forEach((s, i) => {
          out += "\n" + (i+1) + ". " + s.en + "\n";
          if (s.ko_ref) out += "   해석  " + s.ko_ref + "\n";
          if (s.ko_literal) out += "   직역  " + s.ko_literal + "\n";
        });
      } else {
        out += (p.body || "(내용 없음)") + "\n";
        out += "\n(아직 문장으로 나누지 않은 문항입니다)\n";
      }
      out += "\n" + "-".repeat(40) + "\n";
    });
    const safe = String(title).replace(/[\\/:*?"<>|]/g, "_").slice(0, 60);
    const blob = new Blob(["﻿" + out], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = safe + ".txt";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    $$("[data-menu]").forEach(x => x.classList.add("hide"));
  } catch(e){ alert("내려받지 못했어요: " + e.message); }
}

/* 한글이 영문보다 훨씬 많으면 해설지로 본다 */
function koHeavy(text){
  const ko = (text.match(/[가-힣]/g) || []).length;
  const en = (text.match(/[A-Za-z]/g) || []).length;
  return ko > en;
}

async function handleFiles(files){
  dropBusy("읽는 중…");
  try {
    /* 1) 파일을 하나씩 읽어 문제지 / 해설지로 갈라놓는다 */
    const docs = [], notes = [], imgs = [];
    for (const f of files) {
      const nm = f.name.replace(/\.[^.]+$/, "");
      if (f.type === "application/pdf") {
        const r = await readPdf(f);
        if (r.text && r.text.trim().length > 80) {
          (koHeavy(r.text) ? notes : docs).push({ name: nm, text: r.text.trim() });
        } else if (r.images.length) imgs.push(...r.images);   // 스캔본은 사진으로
      } else if (f.type.indexOf("image/") === 0) {
        imgs.push(await shrink(f));
      }
    }
    if (!docs.length && !notes.length && !imgs.length) {
      showErr("#addErr","파일에서 글자를 찾지 못했어요. 사진으로 다시 찍거나 직접 붙여넣어 주세요.");
      dropBusy(""); return;
    }

    /* 2) 올릴 묶음을 만든다 — 문제지는 파일마다 따로, 해설지는 거기에 붙인다 */
    const jobs = [];
    const noteText = notes.map(n => n.text).join("\n\n");
    if (docs.length) {
      docs.forEach(d => jobs.push({
        title: d.name,
        text: d.text + (noteText ? "\n\n" + noteText : ""),   // 번호가 맞는 해설만 골라 쓴다
      }));
    } else if (noteText) {
      jobs.push({ title: notes[0].name, text: noteText });
    }
    if (imgs.length) jobs.push({ title: (files.find(f=>f.type.indexOf("image/")===0)||files[0]).name.replace(/\.[^.]+$/,""), files: imgs });

    /* 3) 하나씩 올린다 */
    let first = null, failed = [];
    for (let i = 0; i < jobs.length; i++) {
      const big = (jobs[i].text || "").length > 42000;   // 두꺼운 자료는 나눠 읽느라 더 걸린다
      dropBusy(jobs.length > 1
        ? (i+1) + " / " + jobs.length + " — " + jobs[i].title.slice(0,18) + " 나누는 중…"
        : (big ? "긴 자료를 나눠 읽는 중… (1~2분)" : "문항 나누는 중… (20~40초)"));
      try {
        const j = await fn("tr-split", Object.assign({ token: S.token }, jobs[i]));
        if (!first) first = j.exam;
        if (j.truncated) failed.push(jobs[i].title + " (일부만 읽힘)");
      } catch(e){ failed.push(jobs[i].title); }
    }

    await loadLists();
    dropBusy("");
    if (failed.length) showErr("#addErr", "이 파일은 넣지 못했어요: " + esc(failed.join(", ")), "keep");
    if (!first) return;

    if (jobs.length > 1) {
      showErr("#addErr", "자료 " + (jobs.length - failed.length) + "개로 나눠 저장했어요" +
        (notes.length ? " (해설지 " + notes.length + "개는 문제지에 붙였어요)" : "") + ".", "info");
      $("#examBox").scrollIntoView({ behavior:"smooth", block:"start" });
    } else {
      openExam(first.id);      // 하나면 바로 그 자료의 문항 목록으로
    }
    return;
  } catch(err){ showErr("#addErr", esc(err.message)); }
  dropBusy("");
}

async function readPdf(file){
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const pages = Math.min(pdf.numPages, 60);   // 워크북처럼 두꺼운 자료도 끝까지 읽는다
  let text = "";
  for (let i=1;i<=pages;i++){
    const page = await pdf.getPage(i);
    const vp = page.getViewport({ scale: 1 });
    const tc = await page.getTextContent();
    text += columnize(tc.items, vp.width) + "\n";
  }
  if (text.replace(/\s/g,"").length > 200) return { text, images: [] };
  const images = [];
  for (let i=1;i<=Math.min(pages,6);i++){
    const page = await pdf.getPage(i), vp = page.getViewport({ scale: 2 });
    const cv = document.createElement("canvas");
    cv.width = vp.width; cv.height = vp.height;
    await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
    images.push({ mime:"image/jpeg", data: cv.toDataURL("image/jpeg",.82).split(",")[1] });
  }
  return { text:"", images };
}

/* 시험지는 2단 편집 — 왼쪽 단을 먼저, 오른쪽 단을 나중에 읽어야 문장이 안 섞인다 */
function columnize(items, width){
  const put = items.filter(it => (it.str||"").trim().length);
  if (!put.length) return "";
  const mid = width/2, L=[], R=[];
  put.forEach(it => { const x=it.transform[4], y=it.transform[5]; (x<mid?L:R).push({x,y,s:it.str}); });
  const render = (arr) => {
    arr.sort((a,b) => (Math.abs(a.y-b.y)>3 ? b.y-a.y : a.x-b.x));
    let out="", lastY=null;
    arr.forEach(w => {
      if (lastY!==null && Math.abs(w.y-lastY)>3) out += "\n";
      else if (out && !/\s$/.test(out)) out += " ";
      out += w.s; lastY = w.y;
    });
    return out;
  };
  if (L.length < 8 || R.length < 8) return render(L.concat(R));
  return render(L) + "\n" + render(R);
}

function shrink(file){
  return new Promise((res,rej)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max=1700, sc=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement("canvas");
      cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      res({ mime:"image/jpeg", data: cv.toDataURL("image/jpeg",.85).split(",")[1] });
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("이미지를 열 수 없어요")); };
    img.src = url;
  });
}

async function openExam(examId){

    await loadTried();
  } catch(e){ $("#ilist").innerHTML = '<div class="err">문항을 불러오지 못했어요.</div>'; return; }
  renderItems();
}

function renderItems(){
  const qs = S.qlist;
  const nos = qs.map(q=>q.no).filter(n=>n!=null);
  const span = nos.length ? (Math.min(...nos)+"번 ~ "+Math.max(...nos)+"번") : "";
  const doneN = qs.filter(q=>S.tried[q.id]).length;
  $("#examTitle").textContent = (S.exam && S.exam.title) || "시험지";
  $("#examSub").textContent = (span ? span+" · " : "") + qs.length + "문항" +
    (doneN ? " · 해본 문항 "+doneN+"개" : "");
  $("#itemsLabel").textContent = "해석할 문항을 고르세요";
  $("#examRename").classList.toggle("hide", !canEditExam(S.exam));

  $("#ilist").innerHTML = qs.length ? qs.map(q => {
    const tried = S.tried[q.id];
    const sub = q.kind === "notice" ? "안내문 · 해석 연습에는 안 맞아요"
      : (q.status === "ready" ? q.sentence_count + "문장" : "아직 안 나눔 — 누르면 준비됩니다");
    return '<button class="pitem" data-item="'+q.id+'">'+
      '<div class="t"><b>'+esc(q.title)+(tried?' <span style="color:var(--ok)">✓</span>':'')+'</b>'+
      '<span>'+sub+(tried?' · '+tried+'번 말함':'')+'</span></div>'+
      '<span class="n" style="'+(q.kind==="notice"?'color:var(--mid);background:var(--mid-w)':'')+'">'+
        (q.kind==="notice"?"안내문":"해석하기 ›")+'</span></button>';
  }).join("") : '<span class="muted">문항이 없어요.</span>';

  $$("[data-item]").forEach(b => b.onclick = () => openPassage(b.dataset.item));
}

/* 자료 이름 바꾸기 — 자료를 연 화면에서 (선생님만) */
$("#examRename").onclick = async () => {

/* 어떤 문항을 얼마나 했는지 표시용 */
async function loadTried(){
  S.tried = {};
  if (!S.token) return;
  try {
    const j = await fn("tr-history", { token:S.token, limit:1000 });
    (j.rows||[]).forEach(r => { if(r.passage_id) S.tried[r.passage_id] = (S.tried[r.passage_id]||0)+1; });
  } catch(e){}
}

function renderQsel(){
  $("#qsel").innerHTML = S.qlist.map(q => {
    const mark = S.tried[q.id] ? " ✓" : (q.status==="ready" ? " ·" : "");
    const tag = q.kind==="notice" ? " (안내문)" : "";
    return '<option value="'+q.id+'">'+esc(q.title)+tag+mark+'</option>';
  }).join("");
}
$("#qsel").onchange = (e) => { abortRec(); openPassage(e.target.value); };

async function openPassage(id){
  S.results={}; S.open={}; S.filter="all"; S.hist={}; S.typing={}; S.retry={}; S.draft={}; S.htry={}; S.htryOpen={};
  const meta = S.qlist.find(q=>q.id===id);
  $("#qselBox").classList.toggle("hide", !S.qlist.length);
  $("#slist").innerHTML = '<div class="card" style="padding:22px;text-align:center"><span class="spin"></span>'+
    '<div class="tiny" style="margin-top:9px">'+(meta && meta.status!=="ready" ? "문장으로 나누는 중… (10~25초)" : "불러오는 중…")+'</div></div>';
  go("study");
  if ($("#qsel").value !== id && S.qlist.length) $("#qsel").value = id;

  try {
    const j = await fn("tr-ingest", { token:S.token, passage_id:id });
    S.passage = j.passage; S.sentences = j.sentences;
    if (meta) { meta.status = "ready"; meta.sentence_count = j.sentences.length; renderQsel(); $("#qsel").value = id; }
  } catch(e){ $("#slist").innerHTML = '<div class="err">'+esc(e.message)+'</div>'; return; }

  renderStudy();
  // 지난번 이 지문에서 말했던 결과 이어붙이기
  try {
    const h = await fn("tr-history", { token:S.token, passage_id:id, limit:400 });
    const seen = {}, hh = {};
    (h.rows||[]).forEach(a => {
      if (a.mode !== S.mode) return;
      (hh[a.sentence_id] = hh[a.sentence_id] || []).push(
        { n:a.try_no||0, score:a.score, verdict:a.verdict, at:a.created_at,
          transcript:a.transcript, input_mode:a.input_mode });
      if (seen[a.sentence_id]) return;
      seen[a.sentence_id] = 1;
      S.results[a.sentence_id] = Object.assign({ transcript:a.transcript, score:a.score, verdict:a.verdict }, a.feedback||{});
    });
    Object.keys(hh).forEach(k => {
      const arr = hh[k].sort((x,y)=>String(x.at||"").localeCompare(String(y.at||"")));
      arr.forEach((v,i)=>{ if(!v.n) v.n = i+1; });
      S.hist[k] = arr;
    });
    if (Object.keys(S.results).length) renderStudy();
  } catch(e){}
}

function startPassage(passage, sentences){
  S.passage = passage; S.sentences = sentences;
  S.results={}; S.open={}; S.filter="all"; S.qlist=[]; S.hist={}; S.typing={}; S.retry={}; S.draft={}; S.htry={}; S.htryOpen={};
  $("#qselBox").classList.add("hide");
  renderStudy(); go("study");
}

/* ================= 학습 ================= */
$$(".seg button").forEach(b => b.onclick = () => {
  abortRec();
  $$(".seg button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); S.mode=b.dataset.mode; S.results={}; S.open={}; S.filter="all";
  S.hist={}; S.typing={}; S.retry={}; S.draft={}; S.htry={}; S.htryOpen={};
  save("mode", S.mode);
  if (S.passage) openPassage(S.passage.id);
});

function renderStudy(){
  const vals = Object.values(S.results);
  const done = vals.length, tot = S.sentences.length;
  const wrong = vals.filter(r=>r.verdict!=="pass").length;
  $("#progbar").style.width = (tot ? done/tot*100 : 0)+"%";
  $("#progtx").textContent = done+"/"+tot;
  const show = S.filter==="wrong"
    ? S.sentences.filter(s => S.results[s.id] && S.results[s.id].verdict!=="pass")
    : S.sentences;
  $("#slist").innerHTML = show.map(s => sentHtml(s, S.sentences.indexOf(s))).join("") + footHtml(done, tot, wrong);
  bindSent();
}

/** 채점이 끝날 때마다 하단 요약(완료 수 · 틀린 문장만 다시)을 다시 그린다.
    예전에는 renderStudy 때만 그려서, 첫 지문을 다 풀어도 버튼이 끝내 안 나타났다. */
function refreshFoot(){
  const vals = Object.values(S.results);
  const done = vals.length, tot = S.sentences.length;
  const wrong = vals.filter(r=>r.verdict!=="pass").length;
  $("#progbar").style.width = (tot ? done/tot*100 : 0)+"%";
  $("#progtx").textContent = done+"/"+tot;
  const el = document.querySelector("[data-foot]");
  if (!el) return;
  const tmp = document.createElement("div");
  tmp.innerHTML = footHtml(done, tot, wrong);
  el.replaceWith(tmp.firstElementChild);
  bindSent();
}

function footHtml(done, tot, wrong){
  let h = '<div class="card" data-foot="1" style="padding:14px;margin-top:4px">';
  if (done) {
    h += '<b style="display:block;font-size:14px;margin-bottom:11px">'+done+'문장 완료'+(wrong?' · 아직 '+wrong+'개 남음':' · 전부 통과 👏')+'</b>';
    h += '<div class="again" style="margin:0">';
    if (wrong) h += S.filter==="wrong"
      ? '<button data-filter="all">전체 문장 보기</button>'
      : '<button data-filter="wrong" style="border-color:var(--bad);color:var(--bad)">틀린 문장만 다시</button>';
    h += '<button data-reset="1">처음부터 다시</button></div>';
  }
  if (S.qlist.length) {
    const i = S.qlist.findIndex(q=>q.id===(S.passage&&S.passage.id));
    const nx = S.qlist[i+1];
    if (nx) h += '<button class="btn sm" style="margin-top:'+(done?'9px':'0')+'" data-nextq="'+nx.id+'">다음 문항 ('+esc(nx.title)+') ›</button>';
  }
  h += '</div>';
  return h;
}

function sentHtml(s,i){
  const r = S.results[s.id], hs = S.hist[s.id] || [];
  const prompt = S.mode==="en2ko" ? s.en : (s.ko_ref || s.ko_literal || "");
  return '<div class="sent'+(r?" "+r.verdict:"")+'" data-id="'+s.id+'">'+
    '<div class="srow"><div class="snum">'+(i+1)+'</div>'+
      '<div class="'+(S.mode==="en2ko"?"stx en":"stx")+'">'+esc(prompt)+'</div>'+
      '<div class="inputcol">'+
        '<button class="mic" data-mic="'+s.id+'">🎙</button>'+
        '<button class="keyb" data-keyb="'+s.id+'" title="타이핑으로 입력">⌨</button>'+
      '</div></div>'+
    (s.filled ? '<div class="fillnote">✎ 빈칸을 채워 완성한 문장이에요'+
      (s.filled_part ? ' — <b>'+esc(s.filled_part)+'</b>' : '')+'</div>' : '')+
    (hs.length ? '<div class="hist" data-htry="'+s.id+'">'+
        hs.map(h => '<span class="hb '+(h.verdict||"")+'">'+h.n+'차 '+h.score+'</span>').join(
          '<span class="hb" style="background:none;color:var(--tx3);padding:3px 0">\u2192</span>')+
        '<span class="lbl">'+(S.htryOpen[s.id] ? "닫기"
          : "지난 기록 "+hs.length+"회"+(hs[hs.length-1] && hs[hs.length-1].at ? " · "+fmtWhen(hs[hs.length-1].at) : ""))+
        '</span></div>' : "")+
    (S.htryOpen[s.id] ? htryHtml(s.id, hs) : "")+
    (S.retry[s.id] ? '<div class="retryhint">다시 해석해 보세요 \u2014 이번 점수도 따로 남습니다.<br>'+
      '<span style="font-weight:600;opacity:.85">지난 채점은 아래 \u2018자세히 보기\u2019 에 그대로 있어요. 먼저 말해보고 확인하면 더 좋아요.</span></div>' : "")+
    (S.typing[s.id] ? typeHtml(s.id) : "")+
    '<div class="live hide" data-live="'+s.id+'"></div>'+
    '<div data-res="'+s.id+'">'+(r ? barHtml(r,s) : "")+'</div></div>';
}

function histHtml(hs){
  const arrow = '<span class="hb" style="background:none;color:var(--tx3);padding:3px 0">→</span>';
  return '<div class="hist">'+
    hs.map(h => '<span class="hb '+(h.verdict||"")+'">'+h.n+'차 '+h.score+'</span>').join(arrow)+
    '</div>';
}

/** 지난 시도 전체 — 몇 차, 몇 점, 그때 뭐라고 말했는지. 모범 해석은 안 보여준다. */
function fmtWhen(v){
  if (!v) return "";
  const d = new Date(v);
  if (isNaN(d)) return "";
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  const t = d.toLocaleTimeString("ko-KR", { hour:"numeric", minute:"2-digit" });
  return sameDay ? "오늘 "+t : d.toLocaleDateString("ko-KR",{month:"numeric",day:"numeric"})+" "+t;
}

function htryHtml(id, hs){
  const list = hs.slice().sort((a,b)=>(a.n||0)-(b.n||0));
  return '<div class="htry">'+
    list.map(h => '<div class="row">'+
      '<span class="n">'+h.n+'차</span>'+
      '<span class="dt">'+fmtWhen(h.at)+'</span>'+
      '<span class="sc '+(h.verdict==="pass"?"":"")+'" style="color:'+
        (h.verdict==="pass"?"var(--ok)":h.verdict==="fail"?"var(--bad)":"var(--mid)")+'">'+h.score+'</span>'+
      '<span class="tx">'+esc(h.transcript||"(내용 없음)")+
        (h.input_mode==="typed"?' <span style="opacity:.6">\u2328</span>':'')+'</span></div>').join("")+
    '<button class="ag" data-hretry="'+id+'">이 문장 다시 해석하기</button></div>';
}

function typeHtml(id){
  const ph = S.mode==="en2ko" ? "해석을 한국어로 적어보세요" : "영어로 적어보세요";
  return '<div class="typebox"><textarea data-ta="'+id+'" placeholder="'+ph+'">'+esc(S.draft[id]||"")+'</textarea>'+
    '<div class="row"><button class="no" data-typeno="'+id+'">취소</button>'+
    '<button class="go" data-typego="'+id+'">제출하고 채점</button></div></div>';
}

function barHtml(r,s){
  const open = !!S.open[s.id], mo = r.meaning_ok, so = r.structure_ok;
  return '<button class="bar'+(open?" open":"")+'" data-bar="'+s.id+'">'+
      '<span class="pill '+r.verdict+'">'+r.score+'</span>'+
      '<span class="mid"><span class="tags">'+
        '<span class="tg '+(mo?"y":"n")+'">뜻 '+(mo?"○":"✕")+'</span>'+
        '<span class="tg '+(so?"y":"n")+'">구조 '+(so?"○":"✕")+'</span>'+
      '</span><span class="sm">'+esc(r.summary)+'</span></span>'+
      '<span class="more">'+(open?"접기":"자세히 보기")+'</span>'+
      '<span class="arw">▼</span></button>'+
    (open ? detailHtml(r,s) : "");
}

const EKIND = { vague:"얼버무림", structure:"구조", vocab:"어휘", omission:"빠뜨림", addition:"덧붙임", grammar:"문법", nuance:"뉘앙스" };

function detailHtml(r,s){
  const errs = (r.errors||[]).map(e =>
    '<div class="eblk'+(e.kind==="vague"?" vague":"")+'">'+
      '<div class="part">'+esc(e.part)+'<em>'+esc(EKIND[e.kind]||e.kind)+'</em></div>'+
      '<div class="eline"><span class="k">말함</span><span class="x">'+esc(e.student_said)+'</span></div>'+
      '<div class="eline"><span class="k">정답</span><span class="o">'+esc(e.should_be)+'</span></div>'+
      '<div class="why">'+esc(e.why)+'</div></div>').join("");
  return '<div class="res">'+
    '<div class="said"><b>내가 말한 것</b>'+esc(r.transcript)+'</div>'+
    '<div class="judge">'+
      '<div class="jrow '+(r.meaning_ok?"y":"n")+'"><span class="ic">'+(r.meaning_ok?"○":"✕")+'</span>'+
        '<span class="jt"><b>의미 전달</b>'+esc(r.meaning_note||"")+'</span></div>'+
      '<div class="jrow '+(r.structure_ok?"y":"n")+'"><span class="ic">'+(r.structure_ok?"○":"✕")+'</span>'+
        '<span class="jt"><b>구조 파악</b>'+esc(r.structure_note||"")+'</span></div>'+
    '</div>'+
    (r.score < 100 && r.why_not_full
      ? '<div class="deduct"><b>100점이 아닌 이유 · '+(100-r.score)+'점</b>'+esc(r.why_not_full)+'</div>'
      : '')+ errs +
    (r.good ? '<div class="gblk"><b>잘한 점 &nbsp;</b>'+esc(r.good)+'</div>' : '')+
    '<div class="ans"><b>'+(S.mode==="en2ko"?"모범 해석":"모범 영작")+'</b><div class="v">'+esc(r.model_answer)+'</div></div>'+
    (r.model_literal ? '<div class="ans lit"><b>구조 그대로 직역</b><div class="v">'+esc(r.model_literal)+'</div></div>' : '')+
    (r.tip ? '<div class="tip">'+esc(r.tip)+'</div>' : '')+
    ((s.points||[]).length ? '<div class="pts">'+s.points.map(p=>'<span class="pt">'+esc(p)+'</span>').join("")+'</div>' : '')+
    '<div class="again"><button data-retry="'+s.id+'">다시 해석하기</button>'+
    '<button data-next="'+s.id+'">다음 문장 ›</button></div></div>';
}

function redraw(id){
  if (isBusy(id)) return;          // 녹음·채점 중인 카드를 갈아엎지 않는다
  const s = S.sentences.find(x=>x.id===id);
  const card = document.querySelector('[data-id="'+id+'"]');
  if (!s || !card) return;
  const tmp = document.createElement("div");
  tmp.innerHTML = sentHtml(s, S.sentences.indexOf(s));
  card.replaceWith(tmp.firstElementChild);
  bindSent();
}

function bindSent(){
  $$("[data-mic]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const id = b.dataset.mic;
    if (S.typing[id] && !isBusy(id)) { S.typing[id] = false; redraw(id); }
    toggleMic(id);
  });
  $$("[data-bar]").forEach(b => b.onclick = () => {
    const id=b.dataset.bar; S.open[id]=!S.open[id]; redraw(id);
    if (S.open[id]) setTimeout(()=>{ const el=document.querySelector('[data-bar="'+id+'"]'); if(el) el.scrollIntoView({behavior:"smooth",block:"nearest"}); },60);
  });
  $$("[data-retry]").forEach(b => b.onclick = () => {
    const id = b.dataset.retry;
    /* 이전 채점 결과는 지우지 않고 접어만 둔다.
       눈앞에 답이 펼쳐져 있으면 따라 읽게 되지만,
       복습하려고 직접 '자세히 보기'를 누르는 건 막지 않는다. */
    S.open[id] = false;
    S.retry[id] = true; S.typing[id] = false;
    redraw(id);
    const card = document.querySelector('[data-id="'+id+'"]');
    if (card) card.scrollIntoView({behavior:"smooth",block:"center"});
    setTimeout(()=>toggleMic(id),260);
  });
  $$("[data-keyb]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const id = b.dataset.keyb;
    if (b.dataset.act === "cancel") {                     // 녹음 중 → ✕ 취소
      abortRec("녹음을 취소했어요. 다시 🎙 를 눌러주세요.");
      return;
    }
    if (grading.has(id)) return;                          // 채점 중에는 못 바꾼다
    if (cur) abortRec();                                  // 다른 문장 녹음 중이면 그 음성은 버린다
    S.typing[id] = !S.typing[id];
    redraw(id);
    const ta = document.querySelector('[data-ta="'+id+'"]');
    if (ta) { ta.focus(); ta.scrollIntoView({behavior:"smooth",block:"center"}); }
  });
  /* 쓰던 글은 상태에 계속 담아둔다 — redraw 가 돌아도 안 지워지게 */
  $$("[data-ta]").forEach(t => t.oninput = () => { S.draft[t.dataset.ta] = t.value; });
  $$("[data-htry]").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const id = b.dataset.htry;
    S.htryOpen[id] = !S.htryOpen[id];
    redraw(id);
  });
  $$("[data-hretry]").forEach(b => b.onclick = () => {
    const id = b.dataset.hretry;
    S.open[id] = false;
    S.retry[id] = true; S.typing[id] = false; S.htryOpen[id] = false;
    redraw(id);
    const card = document.querySelector('[data-id="'+id+'"]');
    if (card) card.scrollIntoView({behavior:"smooth",block:"center"});
    setTimeout(()=>toggleMic(id),260);
  });
  $$("[data-typeno]").forEach(b => b.onclick = () => {
    const id = b.dataset.typeno; S.typing[id] = false; delete S.draft[id]; redraw(id);
  });
  $$("[data-typego]").forEach(b => b.onclick = () => {
    const id = b.dataset.typego;
    const ta = document.querySelector('[data-ta="'+id+'"]');
    const tx = ta ? ta.value.trim() : "";
    if (!tx) { if(ta) ta.focus(); return; }
    S.draft[id] = tx;
    S.typing[id] = false; redraw(id);
    finish(typedSession(id), tx, null, true);
  });
  $$("[data-next]").forEach(b => b.onclick = () => {
    const cid=b.dataset.next;
    /* 방금 통과한 문장은 wrong 목록에서 빠져 findIndex 가 -1 이 된다.
       그때 list[0] 으로 되돌아가 맨 위로 역주행하던 것을 막는다. */
    const list = S.filter==="wrong"
      ? S.sentences.filter(s => S.results[s.id] && (S.results[s.id].verdict!=="pass" || s.id===cid))
      : S.sentences;
    const i=list.findIndex(x=>x.id===cid), nx=(i>=0 ? list[i+1] : null);
    S.open[cid]=false; redraw(cid);
    if (!nx) { alert("여기가 마지막이에요. 수고했어요 👏"); return; }
    const el=document.querySelector('[data-id="'+nx.id+'"]');
    if (el) el.scrollIntoView({behavior:"smooth",block:"center"});
    setTimeout(()=>toggleMic(nx.id),380);
  });
  $$("[data-filter]").forEach(b => b.onclick = () => { abortRec(); S.filter=b.dataset.filter; renderStudy(); window.scrollTo(0,0); });
  $$("[data-reset]").forEach(b => b.onclick = () => {
    abortRec();
    if (!confirm("이 화면의 채점 결과를 지우고 처음부터 다시 풀까요?\n(지난 기록은 '내 기록'에 그대로 남아요)")) return;
    S.results={}; S.open={}; S.filter="all"; S.hist={}; S.typing={}; S.retry={}; S.draft={}; S.htry={}; S.htryOpen={};
    renderStudy(); window.scrollTo(0,0);
  });
  $$("[data-nextq]").forEach(b => b.onclick = () => { abortRec(); openPassage(b.dataset.nextq); });
}

/* ================= 음성 ================= */
/* 세션 격리: 문장마다 독립된 녹음 세션을 만들고, 세션이 바뀌면
   늦게 도착한 이벤트(onend/onstop/onresult)는 전부 버린다.
   예전에는 rec/finalTx 가 전역 하나라, 다른 문장 마이크를 누르면
   앞 문장의 onend 가 새 인식기를 건드려 뒤 문장이 영영 채점되지 않았다. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
            (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
let useFallback = !SR;   // iOS 도 일단 실시간 자막을 시도한다 (실패하면 자동으로 녹음 방식)
let sess = 0;               // 세션 일련번호
let cur = null;             // 지금 '녹음 중'인 세션 — 마이크는 한 번에 하나만
const grading = new Map();  // 채점 중인 세션들 — 문장마다 따로, 동시에 여러 개 가능

/* 한꺼번에 너무 많이 보내면 AI 쪽에서 요청이 몰렸다고 막는다.
   두 개까지만 보내고 나머지는 줄을 세운다. 학생은 계속 녹음할 수 있다. */
const MAX_PARALLEL = 2;
let running = 0; const waiting = [];
function takeSlot(){
  if (running < MAX_PARALLEL) { running++; return Promise.resolve(); }
  return new Promise(r => waiting.push(r));
}
function freeSlot(){
  const next = waiting.shift();
  if (next) next(); else running = Math.max(0, running - 1);
}

const micEl = id => document.querySelector('[data-mic="'+id+'"]');
const liveEl = id => document.querySelector('[data-live="'+id+'"]');
/** 이 문장이 녹음 중이거나 채점 중인가 — redraw 가 화면을 갈아엎지 않도록 막는 데 쓴다 */
const isBusy = id => !!(cur && cur.id === id) || grading.has(id);
/** 지금까지 들린 말 전부 — 확정된 것 + 아직 확정 안 된 것 */
const said = c => ((c.finalTx || "") + " " + (c.interim || "")).replace(/\s+/g," ").trim();

function setLive(id,text,cls){
  const el = liveEl(id); if(!el) return;
  el.classList.remove("hide");
  el.className = "live" + (cls ? " "+cls : "");
  el.textContent = text;
}
function resetMic(id){
  const m=micEl(id); if(m){ m.classList.remove("rec","busy"); m.textContent="🎙"; }
  const card=document.querySelector('[data-id="'+id+'"]'); if(card) card.classList.remove("act");
  setCancelBtn(id, false);
}

/** 녹음 중에는 마이크 아래 ⌨ 버튼이 '✕ 취소' 가 된다.
    잘못 말했을 때 채점으로 넘기지 않고 그냥 버릴 수 있게. */
function setCancelBtn(id, on){
  const b = document.querySelector('[data-keyb="'+id+'"]');
  if (!b) return;
  if (on) { b.classList.add("cancel"); b.textContent = "✕"; b.dataset.act = "cancel"; b.title = "녹음 취소"; }
  else    { b.classList.remove("cancel"); b.textContent = "⌨"; b.dataset.act = ""; b.title = "타이핑으로 입력"; }
}

/** AI 사용량이 바닥나면 문장마다 같은 말을 반복하지 않고 위에 한 번만 알린다. */
let quotaShown = false;
function quotaBanner(){
  if (quotaShown) return;
  quotaShown = true;
  const host = $("#slist");
  if (!host) return;
  const d = document.createElement("div");
  d.className = "err";
  d.style.cssText = "margin:0 0 12px;line-height:1.6";
  d.innerHTML = "<b>오늘 AI 채점 사용량을 다 썼어요.</b><br>"+
    "지금은 채점이 되지 않습니다. 선생님께 알려주세요.<br>"+
    "<span style='opacity:.8'>말한 내용은 저장되지 않으니, 나중에 다시 해주세요.</span>";
  host.prepend(d);
  d.scrollIntoView({behavior:"smooth", block:"center"});
}

/** 녹음 세션을 즉시 죽인다. 이미 채점에 들어간 건 여기 오지 않는다. */
function killSession(c, msg){
  if (!c || c.aborted || c.grading) return;
  c.aborted = true;
  stopBackup(c);
  try { if (c.rec) { c.rec.onend=null; c.rec.onresult=null; c.rec.onerror=null;
                     if (c.rec.abort) c.rec.abort(); else c.rec.stop(); } } catch(e){}
  try { if (c.mr && c.mr.state === "recording") { c.mr.onstop=null; c.mr.stop(); } } catch(e){}
  try { if (c.stream) c.stream.getTracks().forEach(t=>t.stop()); } catch(e){}
  if (cur === c) { cur = null; S.recording = false; }
  resetMic(c.id);
  if (msg) setLive(c.id, msg, "empty");
  else { const lv = liveEl(c.id); if (lv) lv.classList.add("hide"); }
}
/** 화면 이동·필터 전환 등에서 녹음을 그냥 버릴 때 */
function abortRec(msg){ killSession(cur, msg); }

function toggleMic(id){
  if (grading.has(id)) return;                   // 이 문장은 채점 중 — 결과를 기다린다
  if (cur && cur.id === id) { stopRec(); return; }
  /* 앞 문장이 '녹음 중'이면 그것만 취소한다.
     앞 문장이 '채점 중'이면 그대로 두고 바로 다음 문장을 녹음한다.
     채점은 문장마다 따로 돌기 때문에 기다릴 필요가 없다. */
  if (cur) abortRec("녹음을 취소했어요.");
  startRec(id);
}

/** 학생이 ■ 를 눌러 스스로 끝낸 경우 — 여기서만 채점으로 넘어간다 */
function stopRec(){
  const c = cur;
  if (!c || c.aborted || c.grading) return;
  setLive(c.id, "채점하는 중이에요… 다른 문장 먼저 하셔도 돼요", "empty");
  c.userStopped = true;

  /* ■ 를 눌렀는데 아무 일도 안 일어나던 문제.
     아이폰은 인식기가 한 마디마다 끊겼다 다시 켜진다. 그 '꺼져 있는 찰나'에 ■ 를 누르면
     rec.stop() 이 아무것도 하지 않고 onend 도 안 와서 채점이 영영 시작되지 않았다.
     그래서 무슨 일이 있어도 채점으로 넘어가도록 보험을 건다. */
  const force = () => {
    if (c.aborted || c.grading || cur !== c) return;
    finish(c, said(c));
  };

  stopBackup(c);
  if (c.rec) {
    try { c.rec.stop(); } catch(e){}
    setTimeout(force, 1200);
  } else if (c.mr && c.mr.state === "recording") {
    try { c.mr.stop(); } catch(e){ finish(c, ""); return; }
    setTimeout(() => { if (!c.aborted && !c.grading && cur === c) finish(c, ""); }, 4000);
  } else {
    force();
  }
}

async function startRec(id){
  const c = { n: ++sess, id, pid: S.passage ? S.passage.id : null, mode: S.mode,
              rec:null, mr:null, stream:null, chunks:[],
              finalTx:"", interim:"", userStopped:false, restarts:0, aborted:false, grading:false };
  cur = c; S.recording = true;
  const m=micEl(id); if(m){ m.classList.remove("busy"); m.classList.add("rec"); m.textContent="■"; }
  const card=document.querySelector('[data-id="'+id+'"]'); if(card) card.classList.add("act");
  setCancelBtn(id, true);
  const what = S.mode==="en2ko" ? "한국어로 해석해 보세요" : "영어로 말해 보세요";
  /* 버튼 누르자마자 말하면 마이크가 켜지기 전 0.3~0.5초가 날아가 첫 단어가 잘린다.
     잠깐 '준비' 를 보여주고 그 다음에 말하게 한다. */
  setLive(id, "잠깐만요…", "ready");
  setTimeout(() => {
    if (c.aborted || cur !== c) return;
    setLive(id, "지금 말하세요", "go");
    setTimeout(() => {
      if (c.aborted || cur !== c || c.heard) return;
      setLive(id, what + "\n다 말했으면 ■ · 잘못 말했으면 ✕", "empty");
    }, 1100);
  }, 800);

  if (!useFallback) {
    try {
      const rec = new SR(); c.rec = rec;
      rec.lang = S.mode==="en2ko" ? "ko-KR" : "en-US";
      // iOS 는 continuous 가 불안정해서 중간에 끊긴다. onend 에서 이어 붙인다.
      rec.continuous = !IOS; rec.interimResults = true; rec.maxAlternatives = 1;
      c.heard = false;
      rec.onresult = e => {
        if (c.aborted || cur !== c) return;
        let itm="";
        for (let i=e.resultIndex;i<e.results.length;i++){
          const t=e.results[i][0].transcript;
          if (e.results[i].isFinal) c.finalTx+=t; else itm+=t;
        }
        /* 아이폰은 '확정' 신호가 안 오고 끝나는 일이 잦다.
           화면에 보이던 글자를 버리면 학생은 분명히 말했는데 안 들렸다고 나온다. */
        if (itm) c.interim = itm;
        c.heard = true; c.restarts = 0;
        setLive(id,(c.finalTx+itm).trim()||"…");
      };
      rec.onerror = e => {
        if (c.aborted || cur !== c) return;
        if (e.error==="not-allowed"||e.error==="service-not-allowed"){
          killSession(c, "마이크 권한이 필요해요. 주소창의 자물쇠 → 마이크 허용을 눌러주세요."); return;
        }
        if (e.error==="no-speech") return;
        // 이 기기에서 실시간 자막이 안 되는 경우 - 조용히 녹음 방식으로 갈아탄다
        useFallback = true;
        if (!c.heard && !c.userStopped) {
          try { rec.onend=null; rec.onresult=null; rec.abort(); } catch(x){}
          c.rec = null;
          recordAudio(c);
        }
      };
      rec.onend = () => {
        if (c.aborted || cur !== c) return;
        // 라운드가 끝나면 미확정 글자를 확정분에 넣어 둔다 (안 그러면 다음 라운드가 덮어쓴다)
        if (c.interim) { c.finalTx = (c.finalTx + " " + c.interim).replace(/\s+/g," "); c.interim = ""; }
        if (c.userStopped) { finish(c, said(c)); return; }
        // 학생이 ■ 를 누르기 전에는 계속 듣는다. iOS 는 한 마디마다 끊겨서 이어 붙여야 한다.
        if (c.restarts++ < 12) { try{ rec.start(); }catch(err){ finish(c, said(c)); } }
        else finish(c, said(c));
      };
      rec.start();
      /* 보험: 자막이 글자를 못 넘겨줄 때를 대비해 소리도 같이 담아 둔다.
         이게 없으면 학생이 분명히 말했는데 '아무 말도 들리지 않았어요' 가 뜬다. */
      backupAudio(c);
      return;
    } catch(err){ useFallback = true; c.rec = null; }
  }

  await recordAudio(c);
}

/** 실시간 자막이 안 되는 기기용 - 녹음해서 서버에서 받아적는다 */
/** 자막과 나란히 도는 백업 녹음. 실패해도 조용히 넘어간다. */
async function backupAudio(c){
  try {
    if (!navigator.mediaDevices || !window.MediaRecorder) return;
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    if (c.aborted || cur !== c) { stream.getTracks().forEach(t=>t.stop()); return; }
    c.bStream = stream;
    const type = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "audio/mp4";
    const mr = new MediaRecorder(stream,{mimeType:type});
    const chunks = [];
    c.bMr = mr; c.bType = type;
    c.bReady = new Promise(res => {
      mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
      mr.onstop = () => {
        try { stream.getTracks().forEach(t=>t.stop()); } catch(e){}
        if (!chunks.length) { res(null); return; }
        const f = new FileReader();
        f.onload = () => res({ mime:type, data:String(f.result).split(",")[1] });
        f.onerror = () => res(null);
        f.readAsDataURL(new Blob(chunks,{type}));
      };
    });
    mr.start();
  } catch(e){ /* 백업이 안 되면 자막만으로 간다 */ }
}

function stopBackup(c){
  try { if (c.bMr && c.bMr.state === "recording") c.bMr.stop(); } catch(e){}
  try { if (c.bStream) c.bStream.getTracks().forEach(t=>t.stop()); } catch(e){}
}

async function recordAudio(c){
  const id = c.id;
  if (c.aborted) return;
  setLive(id, "녹음 중 — 다 말했으면 ■ 를 누르세요\n(이 기기는 말하는 중 자막이 안 떠요)", "empty");
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    if (c.aborted || cur !== c) { stream.getTracks().forEach(t=>t.stop()); return; }
    c.stream = stream;
    const type = MediaRecorder.isTypeSupported("audio/webm") ? "audio/webm" : "audio/mp4";
    const mr = new MediaRecorder(stream,{mimeType:type}); c.mr = mr;
    mr.ondataavailable = e => { if(e.data.size) c.chunks.push(e.data); };
    mr.onstop = async () => {
      try { stream.getTracks().forEach(t=>t.stop()); } catch(e){}
      if (c.aborted || cur !== c) return;
      if (!c.chunks.length) { finish(c, ""); return; }
      const b64 = await new Promise(r=>{ const f=new FileReader();
        f.onload=()=>r(String(f.result).split(",")[1]); f.readAsDataURL(new Blob(c.chunks,{type})); });
      if (c.aborted || cur !== c) return;
      finish(c,"",{mime:type,data:b64});
    };
    mr.start();
  } catch(err){
    killSession(c, "마이크를 사용할 수 없어요. 브라우저에서 마이크 권한을 허용해 주세요.");
  }
}

/** 타이핑 제출도 같은 파이프라인을 타되, 녹음 없는 세션을 하나 만든다 */
function typedSession(id){
  if (cur && cur.id === id) abortRec();
  const c = { n: ++sess, id, pid: S.passage ? S.passage.id : null, mode: S.mode,
              rec:null, mr:null, stream:null, chunks:[],
              finalTx:"", userStopped:true, restarts:0, aborted:false, grading:false };
  return c;
}

async function finish(c, transcript, audio, typed){
  if (!c || c.aborted) return;
  const id = c.id;
  if (cur === c) { cur = null; S.recording = false; }   // 마이크 자리를 즉시 비운다

  if (!transcript && !audio && c.bReady) {
    // 자막이 글자를 못 넘겼다 - 담아둔 소리를 서버가 받아적게 한다
    setLive(id, "소리로 받아적는 중이에요…", "empty");
    stopBackup(c);
    audio = await Promise.race([ c.bReady, new Promise(r => setTimeout(() => r(null), 6000)) ]);
    if (c.aborted) return;
  }
  if (!transcript && !audio) {
    cur = null; S.recording = false;
    c.aborted = true;
    resetMic(id);
    setLive(id, "아무 말도 들리지 않았어요. 다시 눌러주세요.", "empty");
    return;
  }
  c.grading = true; grading.set(id, c);
  setCancelBtn(id, false);   // 채점 단계에서는 취소가 의미 없다
  const release = () => { if (grading.get(id) === c) grading.delete(id); };
  const m=micEl(id);
  if(m){ m.classList.remove("rec"); m.classList.add("busy"); m.innerHTML='<span class="spin"></span>'; }
  setLive(id, transcript || "녹음을 보내는 중…");

  try {
    if (running >= MAX_PARALLEL) setLive(id, "순서를 기다리는 중이에요… 계속 진행하셔도 돼요", "empty");
    await takeSlot();
    c.slot = true;
    if (c.aborted) { freeSlot(); c.slot=false; release(); return; }
    setLive(id, "채점하는 중이에요…", "empty");

    const body = { token:S.token, sentence_id:id, passage_id:S.passage.id, mode:S.mode,
                   input_mode: typed ? "typed" : "voice" };
    if (transcript) body.transcript = transcript; else body.audio = audio;

    /* 요청이 몰리면(429) 서버가 재시도 가능이라고 알려준다. 학생이 다시 누르지 않아도 되게
       조용히 두 번까지 더 시도한다. */
    let r = null, lastErr = null;
    for (let k = 0; k < 3; k++) {
      try { r = await fn("tr-grade", body); lastErr = null; break; }
      catch(err){
        lastErr = err;
        if (err.data && err.data.quota) break;          // 하루 한도 소진 — 기다려도 안 풀린다
        if (!(err.data && err.data.retryable) || c.aborted) break;
        setLive(id, "채점이 밀리고 있어요. 다시 시도하는 중… ("+(k+2)+"/3)", "empty");
        await new Promise(z => setTimeout(z, 2500 * (k+1)));
      }
    }
    freeSlot(); c.slot = false;
    if (lastErr) throw lastErr;
    release();
    // 그 사이 다른 지문으로 넘어갔으면 화면은 건드리지 않는다 (기록은 이미 저장됨)
    if (c.aborted || !S.passage || S.passage.id !== c.pid || S.mode !== c.mode) return;
    S.results[id] = r;
    S.retry[id] = false;
    delete S.draft[id];
    const hs = (S.hist[id] = S.hist[id] || []);
    hs.push({ n: r.try_no || hs.length+1, score: r.score, verdict: r.verdict,
              transcript: r.transcript, input_mode: typed ? "typed" : "voice",
              at: new Date().toISOString() });
    S.open[id] = false;   // 자동으로 펼치지 않는다 - 보던 화면이 밀리지 않게
    const anch = document.querySelector('[data-id="'+id+'"]');
    const above = anch ? anch.getBoundingClientRect().top < 0 : false;
    const h0 = document.body.scrollHeight;
    resetMic(id); redraw(id); refreshFoot();
    if (above) window.scrollBy(0, document.body.scrollHeight - h0);  // 위쪽 카드가 커져도 제자리
    if (S.passage) { S.tried[S.passage.id] = (S.tried[S.passage.id]||0)+1;
      if (S.qlist.length) { const v=$("#qsel").value; renderQsel(); $("#qsel").value=v; } }
  } catch(e){
    if (c.slot) { freeSlot(); c.slot = false; }
    release();
    if (c.aborted || !S.passage || S.passage.id !== c.pid || S.mode !== c.mode) return;
    resetMic(id);
    if (e.status === 401) { alert("로그인이 만료됐어요. 다시 로그인해 주세요."); S.token=null; save("token",null); resetLogin(); go("login"); return; }
    if (e.data && e.data.unclear) {   // 알아듣지 못한 경우 — 점수를 남기지 않는다
      setLive(id, e.message, "empty");
      return;
    }
    const m = String(e.message || "");
    if (e.data && e.data.quota) { quotaBanner(); setLive(id, m, "empty"); return; }
    setLive(id, m.length > 90 ? "채점이 잠시 안 됐어요. 마이크를 다시 눌러 주세요." : m, "empty");
  }
}
/* ================= 기록 ================= */
const KIND = { structure:"구문 구조", vocab:"어휘 뜻", omission:"빠뜨림", addition:"없는 말 추가",
               grammar:"문법·형태", nuance:"뉘앙스", vague:"얼버무림", other:"기타" };
function statHtml(s){
  return "<div><b>"+s.n+"</b><span>총 연습</span></div>"+
         "<div><b>"+s.avg+"</b><span>평균 점수</span></div>"+
         "<div><b>"+s.rate+"%</b><span>통과율</span></div>";
}
function weakHtml(kinds){
  const e = Object.entries(kinds||{}).sort((a,b)=>b[1]-a[1]).slice(0,6);
  if (!e.length) return '<span class="muted">아직 틀린 기록이 없어요.</span>';
  const max = e[0][1];
  return e.map(([k,v]) => '<div class="srow2"><b>'+esc(KIND[k]||k)+'</b>'+
    '<div class="prog"><i style="width:'+Math.round(v/max*100)+'%"></i></div>'+
    '<span class="tiny" style="font-weight:700">'+v+'회</span></div>').join("");
}
function rowsHtml(rows, showName){
  if (!rows.length) return '<span class="muted">아직 기록이 없어요.</span>';
  return rows.slice(0,15).map(r =>
    '<div class="card" style="padding:12px;margin-bottom:8px;display:flex;gap:11px;align-items:center">'+
      '<div class="pill '+r.verdict+'">'+r.score+'</div>'+
      '<div style="flex:1;min-width:0">'+
        (showName ? '<div style="font-size:12px;font-weight:700;color:var(--pri)">'+esc(r.student_name||"이름없음")+'</div>' : '')+
        '<div style="font-size:13px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(r.transcript)+'</div>'+
        '<div class="tiny">'+(r.tr_passages?esc(r.tr_passages.title)+' · ':'')+(r.mode==="en2ko"?"해석":"영작")+' · '+
          new Date(r.created_at).toLocaleDateString("ko-KR",{month:"numeric",day:"numeric"})+'</div>'+
      '</div></div>').join("");
}

async function loadAdmin(){
